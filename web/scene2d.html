<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D 场景 · IndieGen</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { overflow: hidden; background: #0a0c09; }
  #canvas-wrap { position: fixed; inset: 0; }
  .hud { position: fixed; top: 16px; left: 18px; z-index: 10; pointer-events: none; max-width: 48vw; }
  .hud h1 { font-size: 16px; color: var(--accent); letter-spacing: 2px; }
  .hud p { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .hud ul { color: var(--dim); font-size: 11px; margin-top: 8px; list-style: none; line-height: 1.6; }
  .btn-row { position: fixed; right: 18px; bottom: 18px; z-index: 10; display: flex; gap: 8px; }
  #scene-status { position: fixed; bottom: 18px; left: 18px; z-index: 10; color: var(--dim); font-size: 12px; }
  .back { position: fixed; top: 16px; right: 18px; z-index: 10; color: var(--accent); font-size: 13px; }
  #start-overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,9,.82); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #start-overlay .box { text-align: center; }
  #start-overlay h2 { color: var(--accent); letter-spacing: 3px; margin-bottom: 12px; }
  #start-overlay p { color: var(--dim); font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div class="hud">
  <h1 id="scene-title">2D 场景</h1>
  <p id="scene-assets"></p>
  <p id="scene-action" style="color:var(--ok);font-size:13px;margin-top:6px;min-height:18px"></p>
  <ul id="asset-list"></ul>
</div>
<a class="back" id="mode-link" href="/scene.html">3D 场景 →</a>
<div id="scene-status">加载中…</div>
<div class="btn-row">
  <button id="spin-btn" class="ghost">旋转角色</button>
  <button id="sound-btn" class="ghost hidden">音效开/关</button>
</div>
<div id="start-overlay"><div class="box"><h2 id="ov-title">2D 场景</h2><p>点击任意处开启音乐与音效 · A/D 或 ←/→ 移动角色 · 空格旋转查看 3D 厚度</p></div></div>
<script src="/static/vendor/three.min.js"></script>
<script src="/static/scene2d.js?v=1"></script>
</body>
</html>
